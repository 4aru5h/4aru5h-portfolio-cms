services:
  - type: web
    name: portfolio-cms
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: AM5landing742762
      - key: SERVE_CLIENT
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: CLIENT_URL
        value: https://portfolio-cms-j40t.onrender.com

